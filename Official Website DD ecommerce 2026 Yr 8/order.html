
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-SPORTS | Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo"><span>X</span>-SPORTS</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="order.html">Order</a>
    </nav>
</header>

<div class="order-container">

    <h2>PLACE YOUR ORDER</h2>

    <form onsubmit="submitOrder(event)">

        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="phone">Contact Number:</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" required>

        <label for="product">Select Product:</label>
        <select id="product" required>
            <option value="">Choose a product</option>
            <option>Football</option>
            <option>Basketball</option>
            <option>Sports Shoes</option>
            <option>Sports Bag</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" min="1" value="1" required>

        <button type="submit">SUBMIT ORDER</button>

    </form>

</div>

<footer>
    <p>© 2026 X-SPORTS. All Rights Reserved.</p>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const product = params.get("product");

if (product) {
    document.getElementById("product").value = product;
}

function submitOrder(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const selectedProduct = document.getElementById("product").value;

    alert("Thank you, " + name +
    "! Your " + selectedProduct +
    " order has been submitted successfully.");
}
</script>

</body>
</html>
